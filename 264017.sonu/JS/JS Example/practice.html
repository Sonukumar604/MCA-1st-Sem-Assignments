<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for=""/>Even Number</label>
    <input type="number" id="evenNum" name="evenNum" placeholder="Enter Even Number">
    <button onclick="getEvenNumber()">Submit</button>
    <label for=""/>Odd Number</label>
    <input type="number" id="oddNum" name="oddNum" placeholder="Enter Odd Number">
    <button onclick="getOddNumber()">odd Submit</button>
    <button onclick="getEvenNumber()">evenSubmit</button>

    <p id="result"></p>
    <script>
        function getEvenNumber(){
            var evenNum = document.getElementById("evenNum").value;
            if(evenNum % 2 === 0){
                document.getElementById("result").innerHTML = evenNum + " is an Even Number";
            }else{
                document.getElementById("result").innerHTML = evenNum + " is not an Even Number";
            }
        }

        function getOddNumber(){
            var oddNum = document.getElementById("oddNum").value;
            if(oddNum % 2 !== 0){
                document.getElementById("result").innerHTML = oddNum + " is an Odd Number"; 
            }else{
                document.getElementById("result").innerHTML = oddNum + " is not an Odd Number";
            }
        }
    </script>
</body>
</html>
