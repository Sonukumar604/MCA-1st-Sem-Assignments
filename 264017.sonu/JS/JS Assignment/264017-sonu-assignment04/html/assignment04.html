<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management</title>
</head>
<body>
    <h1>Display All Students (Using For-of or For-in loop)</h1>
    
    <div class="All Students">
        <h1>1. Student Result Management</h1>
        <div><button type="button" onclick="Display()">Display Students</button></div>
        <div id="output"></div>

    </div>

    <div class="Add New Students">
        <h1>2. Add New Students</h1>
        <input type="text" id="name" placeholder="Enter Student Name">
        <input type="text" id="rollNumber" placeholder="Enter Student Roll No">
        <input type="text" id="marks" placeholder="Enter Student Marks">
        <button type="button" onclick="AddStudent()">Add Student</button>
        <div id="output1"></div>
        
    </div>

    <div class="Find Highest Marks">
        <h1>3. Find Highest Marks</h1>
        <button type="button" onclick="FindHighestMarks()">Find Highest Marks</button>
        <div id="output2"></div>
    </div>

    <div class="Find Lowest Marks">
        <h1>4. Find Lowest Marks</h1>
        <button type="button" onclick="FindLowestMarks()">Find Lowest Marks</button>
        <div id="output3"></div>
    </div>

    <div class="Search Student">
        <h1>5. Search Student</h1>
        <input type="text" id="searchName" placeholder="Enter Student Roll No. to Search">
        <button type="button" onclick="SearchStudent()">Search Student</button>
        <div id="output4"></div>
    </div>

    <div class="PassorFail">
        <h1>6. Pass-Or-Fail</h1>
        <input type="text" id="passFailName" placeholder="Enter Student Roll No. to Check Pass/Fail">
        <button type="button" onclick="PassOrFail()">Check Pass/Fail</button>
        <div id="output5"></div>
    </div>

    <div class="Average Marks">
        <h1>7. Average Marks</h1>
        <button type="button" onclick="AverageMarks()">Calculate Average Marks</button>
        <div id="output6"></div>
    </div>

    <div class="Students Above 80 Marks">
        <h1>8. Students Above 80 Marks</h1>
        <button type="button" onclick="StudentsAboveAverage()">Find Students Above 80 Marks</button>
        <div id="output7"></div>
    </div>

    <div class="Other"




</body>
<script src="../js/script.js"></script> 
</html>
