<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/script.js" defer></script>
</head>

<body>
    <section>
        <div id="head">
            <h1>Student Result Management</h1>
        </div>
    </section>
    <section class="std-sec">
        <div class="dis-std">
            <h1>1. Display All Student(Using For-Of or For-In loop)</h1>
            <button onclick="showstudent()">Display Student</button>
            <div class="result" id="result1">

            </div>
        </div>
    </section>
    <section class="std-sec">
        <div class="dis-std">
            <h1>2. Add New Student</h1>
            <input type="text" name="name" id="studentname" placeholder="Student Name">
            <input type="number" name="rollno." id="rollno" placeholder="Roll Number">
            <input type="number" name="marks" id="marks" placeholder="Marks">
            <button onclick="addstudent()">Add Student</button><br>
            <div class="result" id="add-student">

            </div>
        </div>
    </section>
    <section class="std-sec">
        <div class="dis-std">
            <h1>3. Find Highest Marks</h1>
            <button onclick="findhighestmarks()">Find Highest</button>
            <div class="result" id="hmarks">

            </div>
        </div>
    </section>
    <section class="std-sec">
        <div class="dis-std">
            <h1>4. Find Lowest Marks</h1>
            <button onclick="findlowestmarks()">Find Lowest</button>
            <div class="result" id="low-marks">

            </div>
        </div>
    </section>
    <section class="std-sec">
        <div class="dis-std">
            <h1>4. Search Student</h1>
            <input type="text" name="" id="seastd" placeholder="EnterRoll Number">
            <button onclick="searchstudent()">Search</button>
            <div class="result" id="see-std">

            </div>
        </div>
    </section>
    <section class="std-sec">
        <div class="dis-std">
            <h1>6. Pass or Fail</h1>
            <button onclick="result()">Cheak Result</button>
            <div class="result" id="result-pas">

            </div>
        </div>
    </section>
    <section class="std-sec">
        <div class="dis-std">
            <h1>7. Average Marks</h1>
            <button onclick="average()">Calculate Average</button>
            <div class="result" id="avd-marks">

            </div>
        </div>
    </section>
    <section class="std-sec">
        <div class="dis-std">
            <h1>8. Student Above 80 Marks</h1>
            <button onclick="marksabove()">Display Students</button>
            <div class="result" id="80-above">

            </div>
        </div>
    </section>
</body>

</html>
